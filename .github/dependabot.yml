# =============================================================================
# PANAS TOKEN ECOSYSTEM - DEPENDABOT CONFIGURATION
# Panacea | Icono SA
# =============================================================================

version: 2
updates:
  # =============================================================================
  # NPM DEPENDENCIES
  # =============================================================================
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/La_Paz'
    open-pull-requests-limit: 10
    reviewers:
      - 'panacea-icono'
    assignees:
      - 'panacea-icono'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'javascript'
    ignore:
      # Ignorar actualizaciones mayores automáticas
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # =============================================================================
  # DOCKER DEPENDENCIES
  # =============================================================================
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'tuesday'
      time: '09:00'
      timezone: 'America/La_Paz'
    open-pull-requests-limit: 5
    reviewers:
      - 'panacea-icono'
    assignees:
      - 'panacea-icono'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'docker'

  # =============================================================================
  # GITHUB ACTIONS
  # =============================================================================
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'wednesday'
      time: '09:00'
      timezone: 'America/La_Paz'
    open-pull-requests-limit: 5
    reviewers:
      - 'panacea-icono'
    assignees:
      - 'panacea-icono'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
